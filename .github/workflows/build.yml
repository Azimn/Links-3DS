name: Build 3DSX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    name: Build Milestone 0.5 and audit Links 2.30
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure devkitPro PATH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEVKITPRO:-}"
          test -n "${DEVKITARM:-}"
          test -d "${DEVKITARM}/bin"
          test -f "${DEVKITARM}/3ds_rules"
          printf '%s\n' "${DEVKITARM}/bin" >> "${GITHUB_PATH}"
          printf '%s\n' "${DEVKITPRO}/tools/bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          command -v 3dsxtool
          command -v smdhtool

      - name: Validate helper scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/fetch-links.sh
          sh -n scripts/inspect-links-interfaces.sh

      - name: Fetch verified Links 2.30 source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch-links.sh scripts/inspect-links-interfaces.sh
          scripts/fetch-links.sh

      - name: Audit upstream interfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          scripts/inspect-links-interfaces.sh artifacts/links-2.30-interface-report.txt
          test -s artifacts/links-2.30-interface-report.txt
          grep -q "struct graphics_driver" artifacts/links-2.30-interface-report.txt
          grep -q "graphics_drivers" artifacts/links-2.30-interface-report.txt

      - name: Build native graphics probe
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j2
          test -s links-3ds.3dsx
          test -s links-3ds.elf

      - name: Collect diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp links-3ds.3dsx artifacts/
          cp links-3ds.elf artifacts/
          if test -f links-3ds.map; then
            cp links-3ds.map artifacts/
          fi
          sha256sum artifacts/links-3ds.3dsx artifacts/links-3ds.elf > artifacts/SHA256SUMS.txt
          arm-none-eabi-size artifacts/links-3ds.elf > artifacts/size-report.txt
          find artifacts -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload build and source audit
        uses: actions/upload-artifact@v4
        with:
          name: links-3ds-milestone-1-source-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
