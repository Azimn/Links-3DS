name: Build 3DSX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-probe:
    name: Build Milestone 0.5 and audit Links 2.30
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure devkitPro PATH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEVKITPRO:-}"
          test -n "${DEVKITARM:-}"
          test -d "${DEVKITARM}/bin"
          test -f "${DEVKITARM}/3ds_rules"
          printf '%s\n' "${DEVKITARM}/bin" >> "${GITHUB_PATH}"
          printf '%s\n' "${DEVKITPRO}/tools/bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          command -v 3dsxtool
          command -v smdhtool

      - name: Validate helper scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/fetch-links.sh
          sh -n scripts/inspect-links-interfaces.sh

      - name: Fetch verified Links 2.30 source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch-links.sh scripts/inspect-links-interfaces.sh
          scripts/fetch-links.sh

      - name: Audit upstream interfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          scripts/inspect-links-interfaces.sh artifacts/links-2.30-interface-report.txt
          test -s artifacts/links-2.30-interface-report.txt
          grep -q "struct graphics_driver" artifacts/links-2.30-interface-report.txt
          grep -q "graphics_drivers" artifacts/links-2.30-interface-report.txt

      - name: Publish interface report
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cp artifacts/links-2.30-interface-report.txt reports/links-2.30-interface-report.txt
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/links-2.30-interface-report.txt
          if git diff --cached --quiet; then
            echo "Interface report is already current"
          else
            git commit -m "Publish Links 2.30 interface report [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build native graphics probe
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j2
          test -s links-3ds.3dsx
          test -s links-3ds.elf

      - name: Collect diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp links-3ds.3dsx artifacts/
          cp links-3ds.elf artifacts/
          if test -f links-3ds.map; then
            cp links-3ds.map artifacts/
          fi
          sha256sum artifacts/links-3ds.3dsx artifacts/links-3ds.elf > artifacts/SHA256SUMS.txt
          arm-none-eabi-size artifacts/links-3ds.elf > artifacts/size-report.txt
          find artifacts -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload build and source audit
        uses: actions/upload-artifact@v4
        with:
          name: links-3ds-milestone-1-source-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  validate-driver:
    name: Compile Links 2.30 3DS driver
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure devkitPro PATH
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${DEVKITARM}/bin" >> "${GITHUB_PATH}"
          printf '%s\n' "${DEVKITPRO}/tools/bin" >> "${GITHUB_PATH}"
          test -x "${DEVKITARM}/bin/arm-none-eabi-gcc"

      - name: Verify host and target compilers
        shell: bash
        run: |
          set -euo pipefail
          command -v cc
          command -v arm-none-eabi-gcc
          cc --version
          arm-none-eabi-gcc --version
          test -d "${DEVKITPRO}/libctru/include"

      - name: Fetch verified Links 2.30 source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch-links.sh
          scripts/fetch-links.sh

      - name: Generate host configuration header for interface validation
        shell: bash
        working-directory: upstream/links-2.30
        run: |
          set -euo pipefail

          # This job validates that the staged 3DS graphics driver matches the
          # Links 2.30 C interfaces. It does not link a complete 3DS browser.
          # Generate cfg.h with the native runner compiler so configure can run
          # its feature probes. Cross-configuring with arm-none-eabi-gcc causes
          # every executable probe to fail and produces false results such as
          # zero-sized integer types and a missing select() function.
          env \
            CC=cc \
            CFLAGS="-O2" \
            ./configure \
              --build=x86_64-pc-linux-gnu \
              --host=x86_64-pc-linux-gnu \
              > configure-host.log 2>&1 || {
                cat configure-host.log
                test -f config.log && cat config.log
                exit 1
              }

          test -s cfg.h
          grep -q "SIZEOF_UNSIGNED" cfg.h

      - name: Compile staged 3DS graphics driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/driver-check
          arm-none-eabi-gcc \
            -std=gnu11 \
            -Os \
            -Wall \
            -Wextra \
            -Werror \
            -march=armv6k \
            -mtune=mpcore \
            -mfloat-abi=hard \
            -ffunction-sections \
            -fdata-sections \
            -DG \
            -DGRDRV_3DS \
            -I"${DEVKITPRO}/libctru/include" \
            -Iupstream/links-2.30 \
            -Isource \
            -Iplatform/links_3ds \
            -c src-3ds/graphics_3ds.c \
            -o build/driver-check/graphics_3ds.o
          test -s build/driver-check/graphics_3ds.o
          arm-none-eabi-size build/driver-check/graphics_3ds.o

      - name: Upload driver validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: links-3ds-driver-syntax-check
          path: |
            build/driver-check/graphics_3ds.o
            upstream/links-2.30/configure-host.log
          if-no-files-found: error
          retention-days: 14
