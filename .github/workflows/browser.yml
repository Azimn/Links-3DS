name: Build Links Browser 3DSX and CIA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'cia/**'
      - 'source/**'
      - 'src-3ds/**'
      - 'platform/links_3ds/**'
      - 'docs/MILESTONE_1B_RUNTIME_TEST.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/browser.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'cia/**'
      - 'source/**'
      - 'src-3ds/**'
      - 'platform/links_3ds/**'
      - 'docs/MILESTONE_1B_RUNTIME_TEST.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-browser:
    name: Build Milestone 1B browser
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure devkitPro PATH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEVKITPRO:-}"
          test -n "${DEVKITARM:-}"
          test -d "${DEVKITARM}/bin"
          test -d "${DEVKITPRO}/tools/bin"
          printf '%s\n' "${DEVKITARM}/bin" >> "${GITHUB_PATH}"
          printf '%s\n' "${DEVKITPRO}/tools/bin" >> "${GITHUB_PATH}"

      - name: Verify host and 3DS toolchains
        shell: bash
        run: |
          set -euo pipefail
          command -v cc
          command -v curl
          command -v python3
          command -v arm-none-eabi-gcc
          command -v arm-none-eabi-size
          command -v 3dsxtool
          test -d "${DEVKITPRO}/libctru/include"
          test -d "${DEVKITPRO}/libctru/lib"

      - name: Validate build scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-browser-3ds.sh
          bash -n scripts/build-cia.sh
          bash -n scripts/build-runtime-smoke-3ds.sh
          sh -n scripts/fetch-links.sh
          python3 -m py_compile scripts/compile-upstream-3ds.py
          python3 -m py_compile scripts/scan-portability-3ds.py
          python3 -m py_compile scripts/prepare-graphics-3ds.py
          python3 -m py_compile scripts/prepare-upstream-3ds.py
          python3 -m py_compile scripts/generate-cia-assets.py
          python3 -m unittest -v tests/test_prepare_upstream_3ds.py

      - name: Build runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-runtime-smoke-3ds.sh
          scripts/build-runtime-smoke-3ds.sh 2>&1 | tee runtime-smoke-build.log
          test -s build/runtime-smoke-3ds/links-3ds-runtime-smoke.3dsx

      - name: Prepare verified 3DS driver source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-graphics-3ds.py
          grep -q '\.param = NULL' src-3ds/graphics_3ds.c
          grep -q 'links_3ds_event_bridge_attach(dev)' src-3ds/graphics_3ds.c
          grep -q 'links_3ds_platform_stop_input_timer()' src-3ds/graphics_3ds.c

      - name: Build full Links browser
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-browser-3ds.sh scripts/fetch-links.sh
          scripts/build-browser-3ds.sh 2>&1 | tee browser-build.log

      - name: Build installable CIA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-cia.sh
          scripts/build-cia.sh 2>&1 | tee cia-build.log

      - name: Verify browser outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/browser-3ds/links-3ds-browser.elf
          test -s build/browser-3ds/links-3ds-browser.3dsx
          test -s build/browser-3ds/links-3ds-browser.cia
          test -s build/browser-3ds/links-objects.txt
          test -s build/browser-3ds/portability-report.txt
          test -s build/browser-3ds/compile-portability-report.txt
          test -s build/browser-3ds/size-report.txt
          test -s build/browser-3ds/SHA256SUMS.txt
          test -s build/browser-3ds/CIA-SHA256SUMS.txt
          cat build/browser-3ds/size-report.txt
          cat build/browser-3ds/compile-portability-report.txt

      - name: Package Homebrew Launcher test layout
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="build/browser-3ds/package/3ds/links-3ds"
          mkdir -p "${PACKAGE_ROOT}"
          cp build/browser-3ds/links-3ds-browser.3dsx "${PACKAGE_ROOT}/"
          cp docs/MILESTONE_1B_RUNTIME_TEST.md "${PACKAGE_ROOT}/README.md"
          cp build/browser-3ds/SHA256SUMS.txt "${PACKAGE_ROOT}/"

      - name: Upload browser build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: links-3ds-milestone-1b-browser
          path: |
            browser-build.log
            cia-build.log
            runtime-smoke-build.log
            build/runtime-smoke-3ds/
            build/browser-3ds/links-objects.txt
            build/browser-3ds/upstream-object-paths.txt
            build/browser-3ds/*portability-report.txt
            build/browser-3ds/logs/
            build/browser-3ds/*.map
            build/browser-3ds/*.elf
            build/browser-3ds/*.3dsx
            build/browser-3ds/*.cia
            build/browser-3ds/*SHA256SUMS.txt
            build/browser-3ds/cia/
            build/browser-3ds/package/
          if-no-files-found: warn
          retention-days: 30
